<div class="mx-auto max-w-2xl">
  <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand via-brand-strong to-brand-blue p-8 text-white shadow-lg">
    <div class="absolute -right-10 -top-10 h-48 w-48 rounded-full bg-white/10 blur-2xl"></div>
    <div class="absolute -bottom-16 right-24 h-40 w-40 rounded-full bg-white/10 blur-xl"></div>
    <div class="relative">
      <p class="text-xs font-semibold uppercase tracking-widest text-white/70">District Office</p>
      <h1 class="mt-1 text-2xl font-extrabold">Create District</h1>
      <p class="mt-2 text-sm text-white/80">
        Register the district record that churches, employees and members belong to.
      </p>
    </div>
  </div>

  <div class="mt-6 rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm sm:p-8">
    @if (error() && submitted()) {
      <div class="mb-6 flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        <mat-icon class="mt-0.5 text-base">error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 gap-5 md:grid-cols-2">
      <label class="block md:col-span-2">
        <span class="mb-1 block text-xs font-semibold uppercase tracking-wider text-neutral-400">District name</span>
        <input
          formControlName="name"
          placeholder="e.g. Addis Ababa"
          class="w-full rounded-xl border border-neutral-200 px-4 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="mt-1 block text-xs text-red-600">Name is required.</span>
        }
      </label>

      <label class="block">
        <span class="mb-1 block text-xs font-semibold uppercase tracking-wider text-neutral-400">Code</span>
        <input
          formControlName="code"
          placeholder="e.g. AA"
          class="w-full rounded-xl border border-neutral-200 px-4 py-2.5 font-mono text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        />
        @if (form.controls.code.touched && form.controls.code.invalid) {
          <span class="mt-1 block text-xs text-red-600">Code is required.</span>
        }
      </label>

      <label class="block">
        <span class="mb-1 block text-xs font-semibold uppercase tracking-wider text-neutral-400">Address (optional)</span>
        <input
          formControlName="address"
          placeholder="Optional district address"
          class="w-full rounded-xl border border-neutral-200 px-4 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        />
      </label>

      <div class="mt-2 flex justify-end gap-3 md:col-span-2">
        <button
          type="button"
          routerLink="/district"
          class="rounded-full border border-neutral-200 px-6 py-2.5 text-sm font-semibold text-neutral-600 transition hover:border-neutral-300 hover:bg-neutral-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isSaving()"
          class="rounded-full bg-brand px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-strong disabled:opacity-60"
        >
          {{ isSaving() ? 'Creating…' : 'Create District' }}
        </button>
      </div>
    </form>
  </div>
</div>
