<div
  class="rounded-2xl border border-gray-200 bg-white p-5 transition hover:shadow-md dark:border-gray-800 dark:bg-white/[0.03] md:p-6"
>
  <div class="flex items-start justify-between gap-4">
    <div
      class="flex h-12 w-12 items-center justify-center rounded-xl text-2xl"
      [class]="accentClass()"
    >
      <mat-icon>{{ icon() }}</mat-icon>
    </div>

    @if (trend(); as trend) {
      <span
        class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold"
        [class]="trendClass()"
      >
        <mat-icon class="text-sm">
          {{ trend.startsWith('-') ? 'trending_down' : 'trending_up' }}
        </mat-icon>
        {{ trend }}
      </span>
    }
  </div>

  <div class="mt-5 flex items-end justify-between">
    <div>
      <span class="text-sm text-gray-500 dark:text-gray-400">{{ label() }}</span>
      <h4 class="mt-1.5 text-2xl font-bold tracking-tight text-gray-900 dark:text-white/90">
        {{ value() ?? '—' }}
      </h4>
    </div>
  </div>

  @if (hint(); as hint) {
    <p class="mt-1 text-xs text-gray-400 dark:text-gray-500">{{ hint }}</p>
  }
</div>
