<div class="space-y-6">
  <app-page-header
    title="My Payments"
    subtitle="Every payment you contributed across your teams."
  />

  @if (store.isLoading() && !store.historyLoaded()) {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      @for (i of [0, 1, 2]; track i) {
        <div class="h-24 animate-pulse rounded-2xl bg-gray-200/60 dark:bg-gray-800"></div>
      }
    </div>
  } @else if (store.error()) {
    <div class="flex items-start gap-3 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300">
      <mat-icon class="mt-0.5">error_outline</mat-icon>
      <p>{{ store.error() }}</p>
      <button type="button" (click)="store.loadHistory()" class="ml-auto text-sm font-semibold underline">Retry</button>
    </div>
  } @else {
    <!-- Headline stats -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6 xl:grid-cols-3">
      <app-stat-card
        icon="payments"
        label="Payments made"
        [value]="totalCount() | number"
        [trend]="'History'"
        trendClass="bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-300"
      />
      <app-stat-card
        icon="savings"
        label="Total given"
        [value]="totalAmount() | number: '1.0-0'"
        hint="ETB lifetime"
        accentClass="bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300"
      />
      <app-stat-card
        icon="groups"
        label="Most recent team"
        [value]="payments()[0]?.teamName ?? '—'"
        accentClass="bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300"
      />
    </div>

    <!-- Records -->
    <app-table
      title="Payment history"
      subtitle="Searchable record of your contributions"
      [data]="payments()"
      [searchKeys]="['teamName', 'month']"
      [rowKey]="rowKey"
    >
      <app-table-column key="month" header="Month" [sortable]="true">
        <ng-template let-row>
          <span class="whitespace-nowrap font-medium text-gray-700 dark:text-gray-200">
            {{ formatMonth(row['month']) }}
          </span>
        </ng-template>
      </app-table-column>

      <app-table-column key="teamName" header="Team" [sortable]="true">
        <ng-template let-row>
          <span class="whitespace-nowrap text-gray-600 dark:text-gray-300">{{ row['teamName'] }}</span>
        </ng-template>
      </app-table-column>

      <app-table-column key="amount" header="Amount" [sortable]="true">
        <ng-template let-row>
          <span class="whitespace-nowrap font-semibold text-gray-800 dark:text-white">
            {{ row['amount'] | number: '1.0-0' }}
          </span>
        </ng-template>
      </app-table-column>

      <app-table-column key="paidAt" header="Recorded" [sortable]="true">
        <ng-template let-row>
          <span class="whitespace-nowrap text-gray-500 dark:text-gray-400">
            {{ formatPaidAt(row['paidAt']) }}
          </span>
        </ng-template>
      </app-table-column>
    </app-table>
  }
</div>
