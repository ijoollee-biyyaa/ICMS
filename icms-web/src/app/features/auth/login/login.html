<main class="flex min-h-screen items-center justify-center bg-neutral-50 px-4">
  <div class="w-full max-w-md">
    <div class="mb-8 flex flex-col items-center text-center">
      <img
        src="/brand/efgbc.webp"
        alt="EFGBC logo"
        class="mb-4 h-20 w-20 rounded-full shadow-lg"
      />
      <h1 class="text-2xl font-bold text-brand">EFGBC ICMS</h1>
      <p class="text-sm text-neutral-500">Sign in to the district office system</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="rounded-2xl border border-neutral-200 bg-white p-8 shadow-sm"
    >
      @if (error()) {
        <div class="mb-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
          {{ error() }}
        </div>
      }

      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          formControlName="password"
          [type]="hidePassword() ? 'password' : 'text'"
          autocomplete="current-password"
        />
        <button
          type="button"
          mat-icon-button
          matSuffix
          aria-label="Toggle password visibility"
          (click)="hidePassword.set(!hidePassword())"
        >
          <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        type="submit"
        mat-flat-button
        color="primary"
        class="w-full !rounded-full !py-6"
        [disabled]="form.invalid || busy()"
      >
        @if (busy()) {
          <mat-spinner diameter="20" />
        } @else {
          Sign In
        }
      </button>

      <p class="mt-4 text-center text-xs text-neutral-400">
        <a routerLink="/" class="hover:text-brand">← Back to home</a>
      </p>
    </form>
  </div>
</main>
